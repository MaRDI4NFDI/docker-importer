name: docker-importer

# `pull: []` must be an empty list; absent or null means "generate a default
# pull action", which adds a set_working_directory step this image has no
# directory for. `build: null` is repeated on each deployment because the
# check that suppresses the image-build prompt ignores this level.
build: null
push: null
pull: []

deployments:
  - name: staging
    entrypoint: mardi_portal.flows.mardi_importer:mardi_importer_flow
    build: null
    work_pool:
      name: staging-k8s-pool

  - name: production
    entrypoint: mardi_portal.flows.mardi_importer:mardi_importer_flow
    build: null
    work_pool:
      name: prod-k8s-pool

  - name: production
    entrypoint: mardi_portal.flows.zbmath_import:zbmath_import_flow
    build: null
    concurrency_limit: 1
    work_pool:
      name: prod-k8s-pool
      job_variables:
        env:
          PREFECT_LOGGING_LEVEL: DEBUG
          PREFECT_LOGGING_INTERNAL_LEVEL: DEBUG
        volumes:
          - name: workflow-data
            persistentVolumeClaim:
              claimName: importer-workflow-data
        volume_mounts:
          - name: workflow-data
            mountPath: /mnt/workflow-data
