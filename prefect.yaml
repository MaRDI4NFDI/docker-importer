name: docker-importer

# `pull: []` must be an empty list; absent or null means "generate a default
# pull action", which adds a set_working_directory step this image has no
# directory for. `build: null` is repeated on each deployment because the
# check that suppresses the image-build prompt ignores this level.
build: null
push: null
pull: []

deployments:
  - name: staging
    entrypoint: mardi_portal.flows.mardi_importer:mardi_importer_flow
    build: null
    work_pool:
      name: staging-k8s-pool

  - name: production
    entrypoint: mardi_portal.flows.mardi_importer:mardi_importer_flow
    build: null
    work_pool:
      name: prod-k8s-pool

  # Weekly CRAN archive status (end time of CRAN project). Inactive until the
  # first dry run has been reviewed; set `active: true` to enable it.
  # Nightly CRAN import of packages published since yesterday, then the archive status.
  - name: cran-nightly
    entrypoint: mardi_portal.flows.mardi_importer:mardi_importer_flow
    build: null
    concurrency_limit: 1
    parameters:
      action: import/cran
    schedules:
      - cron: "0 2 * * *"
        timezone: Europe/Berlin
        active: false
    work_pool:
      name: prod-k8s-pool
      job_variables:
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: CRANlogger

  - name: cran-archive-sync
    entrypoint: mardi_portal.flows.mardi_importer:mardi_importer_flow
    build: null
    parameters:
      action: sync/cran-archive
    schedules:
      - cron: "0 4 * * 1"
        timezone: Europe/Berlin
        active: false
    work_pool:
      name: prod-k8s-pool

  - name: production
    entrypoint: mardi_portal.flows.zbmath_import:zbmath_import_flow
    build: null
    concurrency_limit: 1
    work_pool:
      name: prod-k8s-pool
      job_variables:
        env:
          PREFECT_LOGGING_LEVEL: DEBUG
          PREFECT_LOGGING_INTERNAL_LEVEL: DEBUG
        volumes:
          - name: workflow-data
            persistentVolumeClaim:
              claimName: importer-workflow-data
        volume_mounts:
          - name: workflow-data
            mountPath: /mnt/workflow-data

  # The update flow keeps its own volume: it has to hold on to the previous
  # full processed dump to diff the next one against it, and its checkpoint is
  # independent of the import flow's.
  - name: production
    entrypoint: mardi_portal.flows.zbmath_update:zbmath_update_flow
    build: null
    concurrency_limit: 1
    work_pool:
      name: prod-k8s-pool
      job_variables:
        env:
          PREFECT_LOGGING_LEVEL: DEBUG
          PREFECT_LOGGING_INTERNAL_LEVEL: DEBUG
        volumes:
          - name: update-data
            persistentVolumeClaim:
              claimName: importer-update-data
        volume_mounts:
          - name: update-data
            mountPath: /mnt/update-data
